services:
  coach:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      COACH_DATA_DIR: /data
      GIT_SSH_COMMAND: ssh -F /ssh/config
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../coach-data:/data
      # Git push for document writes. Without these variables, empty files are mounted
      # and pushes fail, which only matters when GIT_AUTO_PUSH=true.
      - ./deploy/git-ssh-config:/ssh/config:ro
      - ${COACH_DATA_DEPLOY_KEY:-/dev/null}:/ssh/deploy-key:ro
      - ${GIT_KNOWN_HOSTS:-/dev/null}:/ssh/known_hosts:ro
    init: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
