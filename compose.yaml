services:
  coach:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      COACH_DATA_DIR: /data
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ../coach-data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
